<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Portada de El comienzo de DylanOS: un primer nodo de commits brillando en rojo sobre una gráfica de Git">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100a0b"/>
      <stop offset="0.45" stop-color="#09090b"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.4" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#ff2b2b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow">
      <stop offset="0" stop-color="#ff8a8a" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ff2b2b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="graph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0.05"/>
      <stop offset="0.18" stop-color="#ff2b2b" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#ff6b6b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0.05"/>
    </linearGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="gridFadeMask">
      <rect width="1600" height="900" fill="url(#gridFade)"/>
    </mask>

    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="tightGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridFadeMask)"/>
    <rect width="1600" height="900" fill="url(#glow)"/>

    <!-- Anillos de origen -->
    <g fill="none" stroke="#ff2b2b" stroke-width="1.2">
      <circle cx="640" cy="450" r="96" stroke-opacity="0.28"/>
      <circle cx="640" cy="450" r="158" stroke-opacity="0.18"/>
      <circle cx="640" cy="450" r="226" stroke-opacity="0.11"/>
      <circle cx="640" cy="450" r="302" stroke-opacity="0.06"/>
    </g>

    <!-- Halo del primer commit -->
    <circle cx="640" cy="450" r="150" fill="url(#nodeGlow)" opacity="0.55"/>
    <circle cx="640" cy="450" r="46" fill="url(#nodeGlow)" filter="url(#softGlow)"/>

    <!-- Gráfica de commits -->
    <g fill="none" stroke-linecap="round">
      <path d="M300 512 C 430 512, 470 450, 640 450 C 810 450, 860 486, 1000 486 C 1120 486, 1180 452, 1320 452"
            stroke="url(#graph)" stroke-width="3"/>
      <path d="M760 458 C 830 384, 900 372, 990 372 C 1090 372, 1140 414, 1210 448"
            stroke="url(#branch)" stroke-width="2.4"/>

      <!-- Nodos -->
      <g fill="#ff3b3b">
        <circle cx="640" cy="450" r="9"/>
        <circle cx="760" cy="458" r="6" fill-opacity="0.85"/>
        <circle cx="900" cy="378" r="5" fill-opacity="0.8"/>
        <circle cx="1000" cy="486" r="6" fill-opacity="0.85"/>
        <circle cx="1120" cy="470" r="5" fill-opacity="0.7"/>
        <circle cx="1210" cy="448" r="4" fill-opacity="0.55"/>
      </g>

      <!-- Núcleo del primer commit -->
      <circle cx="640" cy="450" r="11" fill="#ffb3b3"/>
      <circle cx="640" cy="450" r="5.5" fill="#ffffff" fill-opacity="0.92" filter="url(#tightGlow)"/>
    </g>

    <!-- Líneas de código difuminadas a la derecha -->
    <g fill="#ffffff">
      <rect x="1000" y="596" width="220" height="7" rx="3.5" fill-opacity="0.10"/>
      <rect x="1000" y="620" width="150" height="7" rx="3.5" fill-opacity="0.07"/>
      <rect x="1040" y="644" width="240" height="7" rx="3.5" fill-opacity="0.09"/>
      <rect x="1040" y="668" width="120" height="7" rx="3.5" fill-opacity="0.05"/>
      <rect x="1000" y="692" width="190" height="7" rx="3.5" fill-opacity="0.06"/>
    </g>

    <!-- Fecha del primer commit -->
    <text x="640" y="560" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" letter-spacing="7" fill="#ffffff" fill-opacity="0.6">06 · 08 · 2026</text>

    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.5"/>
</svg>
